version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: nexbuy-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: nexbuy
    networks:
      - nexbuy-network

  redis:
    image: redis:7-alpine
    container_name: nexbuy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nexbuy-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexbuy-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/nexbuy
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    networks:
      - nexbuy-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexbuy-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - nexbuy-network
    command: npm start

volumes:
  mongodb_data:
  redis_data:

networks:
  nexbuy-network:
    driver: bridge
