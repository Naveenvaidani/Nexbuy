<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - NexBuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/modern.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-bag-check-fill text-warning"></i> NexBuy
            </a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <h2 class="mb-4">Checkout</h2>
            
            <div class="row">
                <div class="col-lg-8">
                    <!-- Delivery Address -->
                    <div class="card mb-3">
                        <div class="card-header">
                            <h5 class="mb-0">Delivery Address</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="fullName" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="phone" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <textarea class="form-control" id="address" rows="3" required></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">City</label>
                                    <input type="text" class="form-control" id="city" required>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">State</label>
                                    <input type="text" class="form-control" id="state" required>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label class="form-label">Pincode</label>
                                    <input type="text" class="form-control" id="pincode" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Payment Method -->
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">Payment Method</h5>
                        </div>
                        <div class="card-body">
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="walletPayment" value="wallet" checked>
                                <label class="form-check-label" for="walletPayment">
                                    <strong>Wallet</strong> <span class="text-muted">(Balance: ₹<span id="walletBalance">0</span>)</span>
                                </label>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="cardPayment" value="card">
                                <label class="form-check-label" for="cardPayment">
                                    <strong>Credit/Debit Card</strong>
                                </label>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="upiPayment" value="upi">
                                <label class="form-check-label" for="upiPayment">
                                    <strong>UPI</strong>
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="paymentMethod" id="codPayment" value="cod">
                                <label class="form-check-label" for="codPayment">
                                    <strong>Cash on Delivery</strong>
                                </label>
                            </div>

                            <!-- Use Coins -->
                            <div class="mt-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="useCoins">
                                    <label class="form-check-label" for="useCoins">
                                        Use <strong><span id="availableCoins">0</span> Coins</strong> (= ₹<span id="coinsValue">0</span>)
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Order Summary -->
                <div class="col-lg-4">
                    <div class="card sticky-top" style="top: 20px;">
                        <div class="card-header">
                            <h5 class="mb-0">Order Summary</h5>
                        </div>
                        <div class="card-body">
                            <div id="orderItems" class="mb-3">
                                <div class="spinner-border spinner-border-sm"></div> Loading...
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal:</span>
                                <span id="subtotal">₹0</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Discount:</span>
                                <span id="discount" class="text-success">-₹0</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Coins Redeemed:</span>
                                <span id="coinsRedeemed" class="text-success">-₹0</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Delivery:</span>
                                <span id="delivery">FREE</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between mb-3">
                                <strong>Total:</strong>
                                <strong id="total" class="text-warning fs-4">₹0</strong>
                            </div>
                            
                            <div class="d-grid">
                                <button class="btn btn-warning btn-lg" id="placeOrderBtn">
                                    <i class="bi bi-lock"></i> Place Order
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        let cart = null;
        let profile = null;

        async function init() {
            if (!authManager.requireAuth()) {
                window.location.href = 'auth.html';
                return;
            }

            await loadUserData();
            await loadCart();
        }

        async function loadUserData() {
            try {
                const response = await api.getProfile();
                if (response.success) {
                    profile = response.user;
                    document.getElementById('walletBalance').textContent = profile.wallet.balance.toLocaleString();
                    document.getElementById('availableCoins').textContent = profile.coins;
                    document.getElementById('coinsValue').textContent = (profile.coins / 10).toFixed(2);
                }
            } catch (error) {
                console.error('Failed to load user data', error);
            }
        }

        async function loadCart() {
            try {
                const response = await api.getCart();
                if (response.success) {
                    cart = response.cart;
                    displayOrderSummary();
                }
            } catch (error) {
                alert('Failed to load cart');
            }
        }

        function displayOrderSummary() {
            if (!cart || cart.items.length === 0) {
                alert('Cart is empty');
                window.location.href = 'cart.html';
                return;
            }

            let itemsHtml = '';
            cart.items.forEach(item => {
                itemsHtml += `
                    <div class="d-flex mb-2">
                        <div class="flex-grow-1">
                            <small>${item.product.title.substring(0, 40)}...</small>
                            <div class="text-muted small">Qty: ${item.quantity}</div>
                        </div>
                        <div>₹${(item.product.price.current * item.quantity).toLocaleString()}</div>
                    </div>
                `;
            });

            document.getElementById('orderItems').innerHTML = itemsHtml;
            updateTotals();
        }

        function updateTotals() {
            const useCoins = document.getElementById('useCoins').checked;
            const coinsValue = useCoins ? profile.coins / 10 : 0;

            document.getElementById('subtotal').textContent = `₹${cart.totals.subtotal.toLocaleString()}`;
            document.getElementById('discount').textContent = `-₹${cart.totals.discount.toLocaleString()}`;
            document.getElementById('coinsRedeemed').textContent = `-₹${coinsValue.toFixed(2)}`;
            document.getElementById('delivery').textContent = cart.totals.delivery > 0 ? `₹${cart.totals.delivery}` : 'FREE';
            
            const finalTotal = Math.max(0, cart.totals.total - coinsValue);
            document.getElementById('total').textContent = `₹${finalTotal.toLocaleString()}`;
        }

        document.getElementById('useCoins').addEventListener('change', updateTotals);

        document.getElementById('placeOrderBtn').addEventListener('click', async () => {
            const fullName = document.getElementById('fullName').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            const city = document.getElementById('city').value;
            const state = document.getElementById('state').value;
            const pincode = document.getElementById('pincode').value;

            if (!fullName || !phone || !address || !city || !state || !pincode) {
                alert('Please fill all address fields');
                return;
            }

            const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
            const useCoins = document.getElementById('useCoins').checked;

            const orderData = {
                shippingAddress: {
                    fullName,
                    phone,
                    addressLine1: address,
                    city,
                    state,
                    pincode,
                    country: 'India'
                },
                paymentMethod,
                useCoins
            };

            try {
                const response = await api.createOrder(orderData);
                
                if (response.success) {
                    if (paymentMethod === 'wallet' || paymentMethod === 'cod') {
                        alert('Order placed successfully!');
                        window.location.href = 'orders.html';
                    } else {
                        initializeRazorpay(response.order);
                    }
                }
            } catch (error) {
                alert('Failed to place order: ' + error.message);
            }
        });

        function initializeRazorpay(order) {
            const options = {
                key: 'rzp_test_key',
                amount: order.totals.total * 100,
                currency: 'INR',
                name: 'NexBuy',
                description: 'Order Payment',
                order_id: order.razorpayOrderId,
                handler: async function(response) {
                    try {
                        const verifyResponse = await api.verifyPayment({
                            orderId: order._id,
                            razorpayPaymentId: response.razorpay_payment_id,
                            razorpayOrderId: response.razorpay_order_id,
                            razorpaySignature: response.razorpay_signature
                        });

                        if (verifyResponse.success) {
                            alert('Payment successful!');
                            window.location.href = 'orders.html';
                        }
                    } catch (error) {
                        alert('Payment verification failed');
                    }
                },
                prefill: {
                    name: profile.name,
                    email: profile.email,
                    contact: profile.phone || ''
                }
            };

            const rzp = new Razorpay(options);
            rzp.open();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
