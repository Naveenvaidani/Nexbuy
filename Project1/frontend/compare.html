<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Products - NexBuy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modern.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-bag-check-fill text-warning"></i> NexBuy</a>
      <div class="ms-auto">
        <a class="btn btn-outline-secondary btn-sm" href="products.html">Back to Products</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h5 class="mb-3">Product Comparison</h5>
    <div id="metaInfo" class="text-muted small mb-3"></div>
    <div id="compareGrid" class="compare-grid"></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script>
    function params() { const u = new URLSearchParams(location.search); return Object.fromEntries(u.entries()); }
    function providerIcon(name){
      const map = { amazon: 'bi-amazon', flipkart: 'bi-shop' };
      return `<span class="provider-badge"><i class="bi ${map[name]||'bi-bag'}"></i> ${name?.toUpperCase()||'N/A'}</span>`
    }
    function money(n){ return `₹${(n||0).toLocaleString()}`; }

    async function loadComparison(){
      const { ids, q } = params();
      let data;
      if (ids) data = await API.compareByIds(ids.split(','));
      else if (q) data = await API.compareProducts(q, ['amazon','flipkart']);
      else {
        document.getElementById('compareGrid').innerHTML = '<div class="alert alert-warning">Provide ids or q in URL.</div>';
        return;
      }

      const grid = document.getElementById('compareGrid');
      if (data.rows) {
        document.getElementById('metaInfo').textContent = `Best deal SKU: ${data.meta?.bestDealSku||'-'} • Generated: ${new Date(data.meta?.generatedAt||Date.now()).toLocaleString()}`;
        grid.innerHTML = data.rows.map(r => `
          <div class="compare-card">
            <div class="text-center mb-2">
              <img src="${r.imageUrl || 'https://picsum.photos/seed/'+encodeURIComponent(r.brand||'product')+'/300/400'}" alt="${r.title}" loading="lazy" style="width:100%; aspect-ratio:3/4; object-fit:cover;" onerror="this.onerror=null; this.src='https://picsum.photos/seed/'+encodeURIComponent('${(r.brand||'product')}')+'/300/400'" />
            </div>
            <div class="small text-muted mb-1">${providerIcon(r.provider)}</div>
            <div class="fw-semibold">${r.title}</div>
            <div class="text-muted small mb-2">${r.brand || ''}</div>
            <div class="d-flex align-items-baseline gap-2">
              <div class="fs-5 text-success">${money(r.priceINR)}</div>
              ${r.shippingCost?`<div class="small text-muted">+ ${money(r.shippingCost)} ship</div>`:''}
            </div>
            <div class="small mb-2">${r.availability?.replace('_',' ') || ''} • ${r.deliveryEstimate || '—'}</div>
            <div class="small mb-2">Rating: ${r.rating||0} ⭐ (${r.reviewsCount||0})</div>
            ${r.bestDeal?'<span class="badge bg-success">Best Deal</span>':''}
            <div class="mt-2"><a href="${r.productUrl}" target="_blank" class="btn btn-sm btn-primary w-100">View Offer</a></div>
          </div>
        `).join('');
      } else if (data.comparison) {
        // fallback display
        grid.innerHTML = data.comparison.map(c => `
          <div class="compare-card">
            <div class="fw-semibold">${c.title||'-'}</div>
            <div class="small">${c.provider?.toUpperCase()||''}</div>
            <div class="fs-5 text-success">${money(c.price||0)}</div>
          </div>
        `).join('');
      }
    }
    loadComparison();
  </script>
</body>
</html>
