<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - NexBuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/modern.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-bag-check-fill text-warning"></i> NexBuy
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Continue Shopping</a>
            </div>
        </div>
    </nav>

    <!-- Cart Content -->
    <section class="py-5">
        <div class="container">
            <h2 class="mb-4"><i class="bi bi-cart3"></i> Shopping Cart</h2>
            
            <div class="row">
                <!-- Cart Items -->
                <div class="col-lg-8">
                    <div id="cartItems">
                        <div class="text-center py-5">
                            <div class="spinner-border text-warning"></div>
                            <p class="mt-2">Loading cart...</p>
                        </div>
                    </div>
                </div>

                <!-- Order Summary -->
                <div class="col-lg-4">
                    <div class="card sticky-top" style="top: 20px;">
                        <div class="card-body">
                            <h5 class="card-title">Order Summary</h5>
                            <div id="orderSummary">
                                <div class="d-flex justify-content-between mb-2">
                                    <span>Subtotal:</span>
                                    <span id="subtotal">₹0</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span>Discount:</span>
                                    <span id="discount" class="text-success">-₹0</span>
                                </div>
                                <div class="d-flex justify-content-between mb-2">
                                    <span>Delivery:</span>
                                    <span id="delivery">FREE</span>
                                </div>
                                <hr>
                                <div class="d-flex justify-content-between mb-3">
                                    <strong>Total:</strong>
                                    <strong id="total">₹0</strong>
                                </div>
                                
                                <!-- Coupon -->
                                <div class="input-group mb-3">
                                    <input type="text" class="form-control" id="couponCode" placeholder="Coupon code">
                                    <button class="btn btn-outline-secondary" id="applyCouponBtn">Apply</button>
                                </div>

                                <div class="d-grid">
                                    <button class="btn btn-warning btn-lg" id="checkoutBtn">
                                        Proceed to Checkout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        let cart = null;

        async function loadCart() {
            if (!authManager.requireAuth()) {
                window.location.href = 'auth.html';
                return;
            }

            try {
                const response = await api.getCart();
                
                if (response.success) {
                    cart = response.cart;
                    displayCart();
                    updateSummary();
                }
            } catch (error) {
                document.getElementById('cartItems').innerHTML = `
                    <div class="alert alert-danger">Failed to load cart</div>
                `;
            }
        }

        function displayCart() {
            const container = document.getElementById('cartItems');

            if (!cart || cart.items.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-5">
                        <i class="bi bi-cart-x display-1 text-muted"></i>
                        <h4 class="mt-3">Your cart is empty</h4>
                        <a href="products.html" class="btn btn-warning mt-3">Start Shopping</a>
                    </div>
                `;
                return;
            }

            let html = '';
            cart.items.forEach(item => {
                html += `
                    <div class="card mb-3">
                        <div class="row g-0">
                            <div class="col-md-2">
                                <img src="${item.product.images[0]?.url || 'https://via.placeholder.com/150'}" 
                                     class="img-fluid rounded-start" alt="${item.product.title}">
                            </div>
                            <div class="col-md-10">
                                <div class="card-body">
                                    <div class="d-flex justify-content-between">
                                        <h6>${item.product.title}</h6>
                                        <button class="btn btn-sm btn-outline-danger" onclick="removeItem('${item._id}')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                    <p class="text-muted small">${item.provider.toUpperCase()}</p>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <div>
                                            <strong class="text-success">₹${item.product.price.current.toLocaleString()}</strong>
                                            ${item.product.price.original > item.product.price.current ? 
                                                `<small class="text-muted ms-2"><s>₹${item.product.price.original.toLocaleString()}</s></small>` : ''}
                                        </div>
                                        <div class="btn-group">
                                            <button class="btn btn-sm btn-outline-secondary" onclick="updateQuantity('${item._id}', ${item.quantity - 1})">
                                                <i class="bi bi-dash"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-secondary" disabled>
                                                ${item.quantity}
                                            </button>
                                            <button class="btn btn-sm btn-outline-secondary" onclick="updateQuantity('${item._id}', ${item.quantity + 1})">
                                                <i class="bi bi-plus"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function updateSummary() {
            if (!cart) return;

            document.getElementById('subtotal').textContent = `₹${cart.totals.subtotal.toLocaleString()}`;
            document.getElementById('discount').textContent = `-₹${cart.totals.discount.toLocaleString()}`;
            document.getElementById('delivery').textContent = cart.totals.delivery > 0 ? `₹${cart.totals.delivery}` : 'FREE';
            document.getElementById('total').textContent = `₹${cart.totals.total.toLocaleString()}`;
        }

        async function updateQuantity(itemId, quantity) {
            if (quantity < 1) {
                removeItem(itemId);
                return;
            }

            try {
                const response = await api.updateCartItem(itemId, quantity);
                if (response.success) {
                    cart = response.cart;
                    displayCart();
                    updateSummary();
                }
            } catch (error) {
                showToast('Failed to update quantity', 'error');
            }
        }

        async function removeItem(itemId) {
            if (!confirm('Remove this item from cart?')) return;

            try {
                const response = await api.removeFromCart(itemId);
                if (response.success) {
                    cart = response.cart;
                    displayCart();
                    updateSummary();
                    showToast('Item removed', 'success');
                }
            } catch (error) {
                showToast('Failed to remove item', 'error');
            }
        }

        document.getElementById('applyCouponBtn').addEventListener('click', async () => {
            const code = document.getElementById('couponCode').value.trim();
            if (!code) return;

            try {
                const response = await api.applyCoupon(code);
                if (response.success) {
                    cart = response.cart;
                    updateSummary();
                    showToast('Coupon applied!', 'success');
                }
            } catch (error) {
                showToast('Invalid coupon code', 'error');
            }
        });

        document.getElementById('checkoutBtn').addEventListener('click', () => {
            if (!cart || cart.items.length === 0) {
                showToast('Cart is empty', 'warning');
                return;
            }
            window.location.href = 'checkout.html';
        });

        function showToast(message, type) {
            alert(message);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
        });
    </script>
</body>
</html>
