    <!-- Search Bar -->
    <section class="bg-light py-4">

                               placeholder="Search products..." value="">

    <!-- Filters & Products -->
    <section class="py-5">
        <div class="container">
            <div class="row">
                <!-- Filters -->
                <div class="col-md-3">
                    <div class="card">
                        <div class="card-body">
                            <h6 class="card-title">Filters</h6>
                            
                            <!-- Provider -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Provider</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="amazon" id="providerAmazon" checked>
                                    <label class="form-check-label" for="providerAmazon">Amazon</label>
                                </div>
                                <div class="form-check">
    <script>
        // Pre-fill search from query param `q` and trigger search
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const q = params.get('q');
            const input = document.getElementById('searchInput');
            const btn = document.getElementById('searchBtn');
            if (q && input) {
                input.value = q;
                // If a global function exists to run search, trigger it
                if (typeof window.runProductSearch === 'function') {
                    window.runProductSearch(q);
                } else if (btn) {
                    btn.click();
                }
            }
        });
    </script>
                                    <input class="form-check-input" type="checkbox" value="flipkart" id="providerFlipkart" checked>
                                    <label class="form-check-label" for="providerFlipkart">Flipkart</label>
                                </div>
                            </div>

                            <!-- Price Range -->
                            <div class="mb-3">

                            <!-- Sort By -->

                <!-- Products Grid -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/lens.js"></script>
    <script src="js/voice.js"></script>
    <script>
        let currentPage = 1;
        let currentQuery = '';
        let selectedProducts = [];

        // Search & Filters wiring
        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        document.getElementById('applyFiltersBtn').addEventListener('click', performSearch);
        document.getElementById('providerAmazon').addEventListener('change', () => loadProducts());
        document.getElementById('providerFlipkart').addEventListener('change', () => loadProducts());
        document.getElementById('sortBy').addEventListener('change', () => loadProducts());

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            currentQuery = query; // allow empty to just filter

            currentQuery = query;
            currentPage = 1;

        // Expose runProductSearch for navbar/chatbot
        window.runProductSearch = async (q) => {
            if (q) {
                document.getElementById('searchInput').value = q;
                currentQuery = q.trim();
            }
            currentPage = 1;
            await loadProducts();
        };
            await loadProducts();
        }

        async function loadProducts(page = 1) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-warning"></div></div>';

            try {
                const providers = [];
                if (document.getElementById('providerAmazon').checked) providers.push('amazon');
                if (document.getElementById('providerFlipkart').checked) providers.push('flipkart');

                const options = {
                    page,
                    limit: 12,
                    providers: providers.join(','),
                    sortBy: document.getElementById('sortBy').value
                };

                const minPrice = document.getElementById('minPrice').value;
                const maxPrice = document.getElementById('maxPrice').value;
                if (minPrice) options.minPrice = minPrice;
                if (maxPrice) options.maxPrice = maxPrice;

                // Prefer paginated DB-backed listing; include q only when present
                const params = {
                    page,
                    limit: 12,
                    providers: providers.join(','),
                    sortBy: document.getElementById('sortBy').value
                };
                if (minPrice) params.minPrice = minPrice;
                if (maxPrice) params.maxPrice = maxPrice;
                if (currentQuery) params.q = currentQuery;

                const response = await API.listProducts(params);

                if (response.success) {
                    displayProducts(response.products);
                    updatePagination(response.pagination);
                }
            } catch (error) {
                grid.innerHTML = '<div class="col-12"><div class="alert alert-danger">Failed to load products</div></div>';
            }
        }

        function displayProducts(products) {
            const grid = document.getElementById('productsGrid');
            const count = document.getElementById('resultsCount');

            if (!products || products.length === 0) {
                grid.innerHTML = '<div class="col-12"><div class="alert alert-info">No products found</div></div>';
                count.textContent = '0 products found';
                return;
            }

            count.textContent = `${products.length} products found`;

            let html = '';
            products.forEach(product => {
                const discountPercent = product.price.original > 0 
                    ? Math.round(((product.price.original - product.price.current) / product.price.original) * 100)
                    : 0;

                html += `
                    <div class="col-md-4">
                        <div class="card h-100 product-card">
                            <div class="position-relative">
                                  <img 
                                      src="${(product.imageUrl || product.imageLarge || product.imageThumb || product.images[0]?.url) || `https://source.unsplash.com/300x400/?${encodeURIComponent((product.subcategory || product.category || product.brand || 'product').toLowerCase())}&sig=${product.sku || product._id || ''}`}" 
                                      srcset="${product.imageUrl || product.imageLarge || product.imageThumb || product.images[0]?.url || ''} 300w, ${product.imageLarge || product.imageUrl || product.images[0]?.url || ''} 900w"
                                      sizes="(max-width: 576px) 100vw, (max-width: 992px) 50vw, 33vw"
                                      class="card-img-top skeleton-image" 
                                      alt="${product.title}"
                                      style="height: 250px; object-fit: cover; aspect-ratio: 3/4;" 
                                      loading="lazy"
                                      onerror="this.onerror=null; this.src='https://picsum.photos/seed/${product.sku || product._id || 'fallback'}/300/400'; this.dataset.failed='1';"
                                  >
                                ${discountPercent > 0 ? `<span class="badge bg-danger position-absolute top-0 end-0 m-2">${discountPercent}% OFF</span>` : ''}
                            </div>
                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title text-dark fw-bold mb-2">${product.title.substring(0, 60)}${product.title.length > 60 ? '...' : ''}</h6>
                                <p class="text-muted small mb-2">${product.provider.toUpperCase()}</p>
                                <div class="mt-auto">
                                    <h5 class="price-current text-success mb-1">₹${product.price.current.toLocaleString()}</h5>
                                    ${product.price.original > product.price.current ? 
                                        `<small class="price-original text-muted text-decoration-line-through">₹${product.price.original.toLocaleString()}</small>` : ''}
                                    <div class="d-grid gap-2 mt-2">
                                        <a href="product.html?id=${product.productId}" class="btn btn-sm btn-outline-primary">
                                            View Details
                                        </a>
                                        <button class="btn btn-sm btn-warning" onclick="addToCart('${product.productId}', '${product.provider}')">
                                            <i class="bi bi-cart-plus"></i> Add to Cart
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        function updatePagination(pagination) {
            if (!pagination || pagination.totalPages <= 1) {
                document.getElementById('paginationNav').style.display = 'none';
                return;
            }

            const nav = document.getElementById('pagination');
            let html = '';

            for (let i = 1; i <= pagination.totalPages; i++) {
                html += `
                    <li class="page-item ${i === pagination.currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" onclick="loadProducts(${i}); return false;">${i}</a>
                    </li>
                `;
            }

            nav.innerHTML = html;
            document.getElementById('paginationNav').style.display = 'block';
        }

        async function addToCart(productId, provider) {
            if (!authManager.requireAuth()) return;

            try {
                const response = await api.addToCart(productId, provider);
                if (response.success) {
                    showToast('Added to cart!', 'success');
                    updateCartCount();
                }
            } catch (error) {
                showToast('Failed to add to cart', 'error');
            }
        }

        // Load products on page load
        document.addEventListener('DOMContentLoaded', () => {
            authManager.updateUI();
            loadProducts();
        });
    </script>
</body>
