<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - NexBuy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/tokens.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/modern.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-bag-check-fill text-warning"></i> NexBuy
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="profile.html">Profile</a>
                <a class="nav-link" href="index.html">Home</a>
            </div>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <h2 class="mb-4"><i class="bi bi-box-seam"></i> My Orders</h2>

            <!-- Filters -->
            <div class="mb-4">
                <div class="btn-group" role="group">
                    <button class="btn btn-outline-primary active" data-status="all">All Orders</button>
                    <button class="btn btn-outline-primary" data-status="processing">Processing</button>
                    <button class="btn btn-outline-primary" data-status="shipped">Shipped</button>
                    <button class="btn btn-outline-primary" data-status="delivered">Delivered</button>
                    <button class="btn btn-outline-primary" data-status="cancelled">Cancelled</button>
                </div>
            </div>

            <!-- Orders List -->
            <div id="ordersList">
                <div class="text-center py-5">
                    <div class="spinner-border text-warning"></div>
                    <p class="mt-2">Loading orders...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Order Details Modal -->
    <div class="modal fade" id="orderDetailsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Order Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="orderDetailsContent">
                    <div class="text-center py-3">
                        <div class="spinner-border spinner-border-sm"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        let currentStatus = 'all';
        let socket;

        async function init() {
            if (!authManager.requireAuth()) {
                window.location.href = 'auth.html';
                return;
            }

            await loadOrders();
            setupStatusFilters();
            connectSocket();
        }

        function setupStatusFilters() {
            document.querySelectorAll('[data-status]').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('[data-status]').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentStatus = this.dataset.status;
                    loadOrders();
                });
            });
        }

        async function loadOrders() {
            const list = document.getElementById('ordersList');
            list.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-warning"></div></div>';

            try {
                const params = currentStatus !== 'all' ? `?status=${currentStatus}` : '';
                const response = await api.getOrders(params);

                if (response.success && response.orders.length > 0) {
                    displayOrders(response.orders);
                } else {
                    list.innerHTML = `
                        <div class="text-center py-5">
                            <i class="bi bi-inbox display-1 text-muted"></i>
                            <h4 class="mt-3">No orders found</h4>
                            <a href="products.html" class="btn btn-warning mt-3">Start Shopping</a>
                        </div>
                    `;
                }
            } catch (error) {
                list.innerHTML = '<div class="alert alert-danger">Failed to load orders</div>';
            }
        }

        function displayOrders(orders) {
            const list = document.getElementById('ordersList');
            let html = '';

            orders.forEach(order => {
                const statusColor = {
                    'processing': 'warning',
                    'shipped': 'info',
                    'delivered': 'success',
                    'cancelled': 'danger'
                }[order.status] || 'secondary';

                html += `
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-8">
                                    <div class="d-flex justify-content-between align-items-start mb-2">
                                        <div>
                                            <h6 class="mb-1">Order #${order.orderId}</h6>
                                            <small class="text-muted">
                                                Placed on ${new Date(order.createdAt).toLocaleDateString()}
                                            </small>
                                        </div>
                                        <span class="badge bg-${statusColor}">${order.status.toUpperCase()}</span>
                                    </div>

                                    <div class="mt-3">
                                        ${order.items.slice(0, 2).map(item => `
                                            <div class="d-flex mb-2">
                                                <img src="${item.product.images[0]?.url || 'https://via.placeholder.com/50'}" 
                                                     width="50" height="50" class="rounded me-2">
                                                <div class="flex-grow-1">
                                                    <div class="small">${item.product.title.substring(0, 50)}...</div>
                                                    <div class="text-muted small">Qty: ${item.quantity} × ₹${item.price.toLocaleString()}</div>
                                                </div>
                                            </div>
                                        `).join('')}
                                        ${order.items.length > 2 ? `<small class="text-muted">+ ${order.items.length - 2} more items</small>` : ''}
                                    </div>
                                </div>

                                <div class="col-md-4 text-end">
                                    <h5 class="text-success mb-3">₹${order.totals.total.toLocaleString()}</h5>
                                    
                                    <div class="d-grid gap-2">
                                        <button class="btn btn-sm btn-outline-primary" onclick="viewOrderDetails('${order._id}')">
                                            <i class="bi bi-eye"></i> View Details
                                        </button>
                                        ${order.status === 'processing' ? `
                                            <button class="btn btn-sm btn-outline-danger" onclick="cancelOrder('${order._id}')">
                                                <i class="bi bi-x-circle"></i> Cancel Order
                                            </button>
                                        ` : ''}
                                        ${order.status === 'delivered' ? `
                                            <button class="btn btn-sm btn-outline-warning" onclick="requestRefund('${order._id}')">
                                                <i class="bi bi-arrow-return-left"></i> Request Refund
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        async function viewOrderDetails(orderId) {
            const modal = new bootstrap.Modal(document.getElementById('orderDetailsModal'));
            const content = document.getElementById('orderDetailsContent');
            
            modal.show();
            content.innerHTML = '<div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>';

            try {
                const response = await api.getOrderDetails(orderId);
                
                if (response.success) {
                    const order = response.order;
                    content.innerHTML = `
                        <div class="mb-3">
                            <h6>Order Information</h6>
                            <p class="mb-1"><strong>Order ID:</strong> ${order.orderId}</p>
                            <p class="mb-1"><strong>Status:</strong> <span class="badge bg-info">${order.status}</span></p>
                            <p class="mb-1"><strong>Date:</strong> ${new Date(order.createdAt).toLocaleString()}</p>
                            <p class="mb-1"><strong>Payment:</strong> ${order.payment.method.toUpperCase()}</p>
                        </div>

                        <div class="mb-3">
                            <h6>Shipping Address</h6>
                            <p class="mb-0">
                                ${order.shippingAddress.fullName}<br>
                                ${order.shippingAddress.addressLine1}<br>
                                ${order.shippingAddress.city}, ${order.shippingAddress.state} ${order.shippingAddress.pincode}
                            </p>
                        </div>

                        <div class="mb-3">
                            <h6>Order Items</h6>
                            ${order.items.map(item => `
                                <div class="d-flex mb-2 pb-2 border-bottom">
                                    <img src="${item.product.images[0]?.url || 'https://via.placeholder.com/80'}" 
                                         width="80" class="rounded me-3">
                                    <div class="flex-grow-1">
                                        <h6 class="mb-1">${item.product.title}</h6>
                                        <p class="mb-1 text-muted small">${item.provider.toUpperCase()}</p>
                                        <p class="mb-0">Qty: ${item.quantity} × ₹${item.price.toLocaleString()}</p>
                                    </div>
                                    <div class="text-end">
                                        <strong>₹${(item.quantity * item.price).toLocaleString()}</strong>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="border-top pt-3">
                            <div class="d-flex justify-content-between mb-2">
                                <span>Subtotal:</span>
                                <span>₹${order.totals.subtotal.toLocaleString()}</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Discount:</span>
                                <span class="text-success">-₹${order.totals.discount.toLocaleString()}</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Delivery:</span>
                                <span>${order.totals.delivery > 0 ? '₹' + order.totals.delivery : 'FREE'}</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <strong>Total:</strong>
                                <strong class="text-success">₹${order.totals.total.toLocaleString()}</strong>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                content.innerHTML = '<div class="alert alert-danger">Failed to load order details</div>';
            }
        }

        async function cancelOrder(orderId) {
            if (!confirm('Are you sure you want to cancel this order?')) return;

            try {
                const response = await api.cancelOrder(orderId);
                if (response.success) {
                    alert('Order cancelled successfully. Refund will be credited to your wallet.');
                    loadOrders();
                }
            } catch (error) {
                alert('Failed to cancel order');
            }
        }

        async function requestRefund(orderId) {
            const reason = prompt('Please provide a reason for refund:');
            if (!reason) return;

            try {
                const response = await api.requestRefund(orderId, reason);
                if (response.success) {
                    alert('Refund request submitted. We will process it within 5-7 business days.');
                    loadOrders();
                }
            } catch (error) {
                alert('Failed to submit refund request');
            }
        }

        function connectSocket() {
            socket = io(API_CONFIG.SOCKET_URL, {
                auth: { token: authManager.getToken() }
            });

            socket.on('orderUpdate', (data) => {
                if (data.orderId) {
                    loadOrders(); // Refresh orders
                    showNotification(`Order ${data.orderId} status updated to: ${data.status}`);
                }
            });
        }

        function showNotification(message) {
            // Simple notification - can be enhanced with toast library
            const notification = document.createElement('div');
            notification.className = 'alert alert-info position-fixed top-0 end-0 m-3';
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
